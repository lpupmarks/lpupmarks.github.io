<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Indian Currency Collection</title>

<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>
:root{
    --paper:#f8f3e6;
    --ink:#222;
    --shadow:rgba(0,0,0,.18);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:
        radial-gradient(circle at top left,#fffef9,#f8f3e6 70%);
    min-height:100vh;
    color:var(--ink);
    font-family:'Patrick Hand',cursive;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    opacity:.06;
    pointer-events:none;
    background:
        repeating-linear-gradient(
            45deg,
            #000 0px,
            #000 1px,
            transparent 1px,
            transparent 6px
        );
}

header{
    text-align:center;
    padding:60px 20px 30px;
}

h1{
    font-family:'Permanent Marker',cursive;
    font-size:clamp(3rem,7vw,6rem);
    line-height:1;
    transform:rotate(-2deg);

    text-shadow:
        4px 4px 0 white,
        8px 8px 0 rgba(0,0,0,.08);
}

.subtitle{
    margin-top:15px;
    font-size:1.4rem;
    transform:rotate(1deg);
}

.stats{
    margin-top:20px;
    display:flex;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.badge{
    background:white;
    padding:10px 18px;
    border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
    font-size:1.1rem;
}

.collection{
    width:min(1500px,95%);
    margin:auto;
    padding:40px 0 80px;

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:45px;
}

.item{
    position:relative;
    transition:.3s ease;
    transform:rotate(var(--rotation));
}

@media (hover:hover){
    .item:hover{
        transform:rotate(0deg) scale(1.06);
        z-index:100;
    }
}

.note,
.coin{
    background:white;
    padding:12px;

    box-shadow:
        0 0 0 10px white,
        0 12px 25px var(--shadow);

    position:relative;
}

.note{
    border-radius:18px;
}

.coin{
    border-radius:18px;
}

/* ===========================
   FRONT + BACK IMAGE LAYOUT
=========================== */

.currency-images{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.currency-images img{
    width:100%;
    display:block;
    background:white;
    object-fit:contain;
    transition:.25s ease;
}

.note .currency-images img{
    border-radius:10px;
}

.coin .currency-images img{
    aspect-ratio:1;
    border-radius:50%;
    padding:4px;
}

.currency-images img:hover{
    transform:scale(1.02);
}

.side-labels{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:8px;

    text-align:center;
    font-size:.95rem;
    opacity:.65;
}

.caption{
    margin-top:14px;
    text-align:center;
    font-size:1.3rem;
}

.year{
    font-size:1rem;
    opacity:.7;
}

.tape{
    position:absolute;
    width:90px;
    height:28px;
    background:rgba(255,255,255,.55);
    top:-12px;
    left:50%;
    transform:translateX(-50%) rotate(-6deg);
    backdrop-filter:blur(1px);
}

.star{
    position:absolute;
    font-size:1.6rem;
    opacity:.2;
}

.s1{top:180px;left:40px;}
.s2{top:700px;right:50px;}
.s3{top:1200px;left:80px;}

footer{
    text-align:center;
    padding:50px 20px;
    font-size:1.2rem;
    opacity:.7;
}

@media(max-width:700px){

    .collection{
        grid-template-columns:1fr;
        gap:35px;
    }

    .badge{
        font-size:1rem;
    }
}

/* lightbox */

.lightbox{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.9);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:9999;
    padding:20px;
}

.lightbox.open{
    display:flex;
}

.lightbox img{
    max-width:95vw;
    max-height:95vh;
    border-radius:12px;
    background:white;
}

.close-btn{
    position:absolute;
    top:20px;
    right:25px;
    color:white;
    font-size:3rem;
    cursor:pointer;
    line-height:1;
}
</style>
</head>

<body>

<header>

    <h1>My Indian Currency Collection</h1>

    <p class="subtitle">
        Coins • Notes • Memories
    </p>

    <div class="stats">
        <div class="badge" id="coinCount">🪙 0 Coins</div>
        <div class="badge" id="noteCount">💵 0 Notes</div>
        <div class="badge">🇮🇳 India</div>
    </div>

</header>

<div class="star s1">★</div>
<div class="star s2">✦</div>
<div class="star s3">★</div>

<section class="collection">

    <!-- NOTE -->

    <div class="item note-item" style="--rotation:-6deg">
        <div class="tape"></div>

        <div class="note">

            <div class="currency-images">
                <img src="1f.webp" alt="₹10 Note Front" loading="lazy">
                <img src="1b.webp" alt="₹10 Note Back" loading="lazy">
            </div>

            <div class="side-labels">
                <div>Front</div>
                <div>Back</div>
            </div>

            <div class="caption">
                ₹10 Note
                <div class="year">1996</div>
            </div>

        </div>
    </div>

    <!-- COIN -->

    <!-- <div class="item coin-item" style="--rotation:4deg">
        <div class="tape"></div>

        <div class="coin">

            <div class="currency-images">
                <img src="2f.webp" alt="1 Rupee Coin Front" loading="lazy">
                <img src="2b.webp" alt="1 Rupee Coin Back" loading="lazy">
            </div>

            <div class="side-labels">
                <div>Front</div>
                <div>Back</div>
            </div>

            <div class="caption">
                1 Rupee Coin
                <div class="year">1985</div>
            </div>

        </div>
    </div> -->

    <!-- EXAMPLES -->

    <div class="item note-item" style="--rotation:-3deg">
        <div class="tape"></div>

        <div class="note">

            <div class="currency-images">
                <img src="3f.webp" alt="₹100 Note Front" loading="lazy">
                <img src="3b.webp" alt="₹100 Note Back" loading="lazy">
            </div>

            <div class="side-labels">
                <div>Front</div>
                <div>Back</div>
            </div>

            <div class="caption">
                ₹100 Note
                <div class="year">Mahatma Gandhi Series</div>
            </div>

        </div>
    </div>

    <!-- <div class="item coin-item" style="--rotation:7deg">
        <div class="tape"></div>

        <div class="coin">

            <div class="currency-images">
                <img src="4f.webp" alt="₹5 Coin Front" loading="lazy">
                <img src="4b.webp" alt="₹5 Coin Back" loading="lazy">
            </div>

            <div class="side-labels">
                <div>Front</div>
                <div>Back</div>
            </div>

            <div class="caption">
                ₹5 Coin
                <div class="year">2005</div>
            </div>

        </div>
    </div> -->

</section>

<footer>
    Collected with curiosity • Preserved with care
</footer>

<!-- LIGHTBOX -->

<div class="lightbox" id="lightbox">
    <span class="close-btn">&times;</span>
    <img id="lightboxImage" src="" alt="">
</div>

<script>

/* dynamic stats */

document.getElementById('coinCount').textContent =
    `🪙 ${document.querySelectorAll('.coin-item').length} Coins`;

document.getElementById('noteCount').textContent =
    `💵 ${document.querySelectorAll('.note-item').length} Notes`;

/* image viewer */

const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightboxImage');

document.querySelectorAll('.currency-images img').forEach(img => {

    img.addEventListener('click', () => {

        lightboxImage.src = img.src;
        lightboxImage.alt = img.alt;

        lightbox.classList.add('open');
    });

});

lightbox.addEventListener('click', e => {

    if (
        e.target === lightbox ||
        e.target.classList.contains('close-btn')
    ){
        lightbox.classList.remove('open');
    }

});

document.addEventListener('keydown', e => {

    if(e.key === 'Escape'){
        lightbox.classList.remove('open');
    }

});

</script>

</body>
</html>
